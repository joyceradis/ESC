name: Sincronizar planilha — propor PR
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: esc-sync-sheet
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'joyceradis/ESC' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Conferir configuração sem expor valores
        env:
          PROVIDER: ${{ vars.ESC_GOOGLE_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.ESC_GOOGLE_SERVICE_ACCOUNT }}
          SHEET: ${{ vars.ESC_SHEET_ID }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ] || [ -z "$SHEET" ]; then
            echo "::error::Sincronização não configurada. Vincular identidade Google de leitura conforme docs/sincronizacao-planilha.md."
            exit 1
          fi
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.ESC_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.ESC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Ler somente colunas bibliográficas
        env:
          ESC_SHEET_ID: ${{ vars.ESC_SHEET_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 tools/sync_sheet.py
      - name: Gerar e validar
        run: |
          python3 build.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/check_site.py
          node --check assets/js/evidence.js
          node --test tests/*.test.mjs
      - name: Abrir PR rascunho e despachar revisão visual
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_sheet_pr.py
