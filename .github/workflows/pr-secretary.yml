name: Secretária de PRs — ESC

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write

concurrency:
  group: esc-pr-secretary
  cancel-in-progress: true

jobs:
  checkpoint:
    # Fork PRs use a read-only token. A scheduled run includes them without granting
    # a write token to pull_request_target or checking out untrusted code.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconciliar painel operacional
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const heading = 'ESC | Secretária de PRs — painel operacional';
            const all = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const prs = all.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const rows = [];
            let blocked = 0;
            let actionRequired = 0;

            function clean(s) {
              return String(s || '').replace(/\r?\n/g, ' ').replace(/\|/g, '\\|').slice(0, 125);
            }
            for (const pr of prs.slice(0, 50)) {
              const [detail, runs, reviews, files] = await Promise.all([
                github.rest.pulls.get({owner, repo, pull_number: pr.number}),
                github.rest.checks.listForRef({owner, repo, ref: pr.head.sha, per_page: 100}),
                github.rest.pulls.listReviews({owner, repo, pull_number: pr.number, per_page: 100}),
                github.rest.pulls.listFiles({owner, repo, pull_number: pr.number, per_page: 100})
              ]);
              const checks = runs.data.check_runs.filter(c =>
                !/Secretária de PRs|secretaria de PRs/i.test(c.name || '')
              );
              const failures = checks.filter(c => ['failure','timed_out','cancelled','action_required'].includes(c.conclusion));
              const pending = checks.some(c => c.status !== 'completed');
              const ci = failures.length ? 'Falha' : pending ? 'Em execução' :
                !checks.length ? 'Sem checks visíveis' : 'Concluídos sem falhas';
              const latest = new Map();
              for (const r of reviews.data) {
                if (r.user && r.state !== 'COMMENTED' && r.state !== 'DISMISSED') latest.set(r.user.login, r.state);
              }
              const review = [...latest.values()].includes('CHANGES_REQUESTED')
                ? 'Alterações solicitadas' : [...latest.values()].includes('APPROVED')
                ? 'Há aprovação' : 'Revisão não confirmada';
              const sensitive = files.data.some(f =>
                /(^|\/)(\.github\/workflows|AGENTS\.md|CLAUDE\.md|auth|security|secrets?|migrations?|access|permissions?)(\/|\.|$)/i.test(f.filename)
              );
              const conflict = detail.data.mergeable === false;
              const signals = [
                pr.draft ? 'Rascunho' : null,
                conflict ? 'Conflito' : null,
                sensitive ? 'Mudança sensível' : null
              ].filter(Boolean).join(', ') || '—';
              let next = 'Revisar escopo/evidências';
              if (pr.draft) next = 'Executor conclui rascunho';
              else if (conflict) next = 'Executor resolve conflito';
              else if (failures.length) next = 'Executor corrige CI';
              else if (pending) next = 'Aguardar checks';
              else if (review === 'Alterações solicitadas') next = 'Executor atende revisão';
              else if (sensitive) next = 'Revisão humana obrigatória';
              else if (review !== 'Há aprovação') next = 'Solicitar revisão independente';
              else next = 'Conferir regras de merge';
              if (conflict || failures.length) blocked++;
              if (!pr.draft && !pending && !conflict && (failures.length || sensitive || review !== 'Há aprovação')) actionRequired++;
              rows.push('| [#' + pr.number + '](' + pr.html_url + ') ' + clean(pr.title) +
                ' | ' + ci + ' | ' + review + ' | ' + signals + ' | ' + next + ' |');
            }

            const body = [
              '# ' + heading,
              '',
              '> Painel informativo, atualizado por eventos e rotina remota. Nenhum resultado de CI é autorização automática para merge ou deploy.',
              '',
              '**PRs abertos:** ' + prs.length +
                ' · **Conflitos/falhas detectadas:** ' + blocked +
                ' · **Exigem atenção:** ' + actionRequired,
              '',
              '| PR | CI visível | Revisão | Sinais | Próxima ação |',
              '|---|---|---|---|---|',
              ...(rows.length ? rows : ['| — | Nenhuma PR aberta | — | — | — |']),
              '',
              ...(prs.length > 50 ? ['> Há ' + (prs.length - 50) + ' PRs adicionais não detalhados aqui.', ''] : []),
              '**Interpretação:** “Concluídos sem falhas” não verifica aderência científica, publicação, branch protection ou cobertura de testes. “Há aprovação” não é aprovação da Joyce. Conflito `mergeable: null` é inconclusivo, não liberado.',
              '',
              '**Escopo:** somente metadados de PRs/checks, sem ler dados clínicos ou arquivos pessoais. Não altera código, branches, reviews, permissões, segredos ou estado dos PRs. Não faz merge.',
              '',
              'Fonte: API do GitHub. Consulte cada PR para evidências detalhadas.'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const found = issues.find(i => !i.pull_request && i.title === heading);
            if (found && found.state === 'closed') {
              core.warning('Painel foi encerrado manualmente; não o reabrir nem criar duplicata.');
            } else if (found && found.body !== body) {
              await github.rest.issues.update({owner, repo, issue_number: found.number, body});
              core.info('Painel atualizado: ' + found.html_url);
            } else if (!found) {
              const created = await github.rest.issues.create({
                owner, repo, title: heading, body
              });
              core.info('Painel criado: ' + created.data.html_url);
            } else {
              core.info('Painel já estava atualizado.');
            }
            await core.summary.addRaw(body).write();
