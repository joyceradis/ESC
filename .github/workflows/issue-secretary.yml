name: Secretária de issues — ESC

on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-secretary-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  organizar:
    if: ${{ !github.event.issue.pull_request && (github.event_name != 'issue_comment' || github.actor == 'joyceradis') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classificar e atualizar o cartão
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const issue=context.payload.issue;
            const issue_number=issue.number;
            const actor=context.actor;
            const event=context.eventName;
            const action=context.payload.action;
            const comment=context.payload.comment?.body||'';
            const labels={
              'type:idea':{color:'d4c5f9',description:'Ideia ou hipótese a desenvolver'},
              'type:bug':{color:'d73a4a',description:'Falha ou regressão'},
              'type:research':{color:'1d76db',description:'Investigação científica'},
              'type:enhancement':{color:'a2eeef',description:'Melhoria técnica ou visual'},
              'area:science':{color:'5319e7',description:'Ciência, referências e protocolo'},
              'area:ux':{color:'c5def5',description:'Interface desktop/celular'},
              'area:automation':{color:'fbca04',description:'Testes e workflows'},
              'area:governance':{color:'bfd4f2',description:'Governança e segurança'},
              'status:triage':{color:'ededed',description:'A classificar'},
              'status:ready':{color:'0e8a16',description:'Escopo pronto para desenvolvimento'},
              'status:in-progress':{color:'fbca04',description:'Em desenvolvimento'},
              'status:blocked':{color:'b60205',description:'Dependência ou decisão pendente'},
              'status:done':{color:'5319e7',description:'Concluída'},
              'decision-recorded':{color:'6f42c1',description:'Decisão da autora registrada'}
            };
            const current=(await github.rest.issues.get({owner,repo,issue_number})).data;
            const currentNames=current.labels.map(l=>typeof l==='string'?l:l.name);
            let add=[];
            const title=issue.title||'';
            if(event==='issues'&&['opened','edited'].includes(action)){
              const type=/^\[BUG\]/i.test(title)?'type:bug':/^\[IDEIA\]/i.test(title)?'type:idea':/^\[(PESQUISA|RESEARCH|CIENCIA)\]/i.test(title)?'type:research':/^\[(MELHORIA|FEATURE)\]/i.test(title)?'type:enhancement':null;
              if(type&&!currentNames.some(l=>l.startsWith('type:')))add.push(type);
              if(!currentNames.some(l=>l.startsWith('status:')))add.push('status:triage');
            }
            let nextStatus=null;
            if(event==='issues'&&action==='closed')nextStatus='status:done';
            if(event==='issues'&&action==='reopened')nextStatus='status:ready';
            if(event==='issue_comment'&&actor==='joyceradis'){
              const commands=[['/ready','status:ready'],['/start','status:in-progress'],['/blocked','status:blocked'],['/done','status:done'],['/reopen','status:ready']];
              for(const [command,status] of commands)if(comment.split(/\r?\n/).some(line=>line.trim()===command))nextStatus=status;
              if(/^##\s*Decisão técnica após revisão/im.test(comment)&&!currentNames.includes('decision-recorded'))add.push('decision-recorded');
            }
            if(nextStatus){
              for(const label of currentNames.filter(l=>l.startsWith('status:')&&l!==nextStatus)){
                await github.rest.issues.removeLabel({owner,repo,issue_number,name:label});
              }
              if(!currentNames.includes(nextStatus))add.push(nextStatus);
            }
            add=[...new Set(add)].filter(l=>!currentNames.includes(l));
            for(const name of add){
              try{await github.rest.issues.getLabel({owner,repo,name});}
              catch(e){if(e.status!==404)throw e;await github.rest.issues.createLabel({owner,repo,name,...labels[name]});}
            }
            if(add.length)await github.rest.issues.addLabels({owner,repo,issue_number,labels:add});
            if(event==='issue_comment'&&actor==='joyceradis'){
              if(comment.split(/\r?\n/).some(line=>line.trim()==='/done'))
                await github.rest.issues.update({owner,repo,issue_number,state:'closed',state_reason:'completed'});
              if(comment.split(/\r?\n/).some(line=>line.trim()==='/reopen'))
                await github.rest.issues.update({owner,repo,issue_number,state:'open'});
            }
            const latest=(await github.rest.issues.get({owner,repo,issue_number})).data;
            const names=latest.labels.map(l=>typeof l==='string'?l:l.name);
            const first=p=>names.find(l=>l.startsWith(p))||'não classificado';
            const card=[
              '<!-- esc-issue-secretary -->',
              '### Organização automática — ESC',
              '',
              '| Campo | Estado |','|---|---|',
              '| Tipo | '+first('type:')+' |',
              '| Área | '+(names.filter(l=>l.startsWith('area:')).join(', ')||'não definida')+' |',
              '| Status | '+first('status:')+' |',
              '| Decisão da autora | '+(names.includes('decision-recorded')?'registrada':'não registrada')+' |',
              '',
              'Comandos da mantenedora: `/ready`, `/start`, `/blocked`, `/done`, `/reopen`.',
              '',
              '_A secretária apenas organiza a issue. Não concede autorização de merge, deploy, acesso a dados ou execução de agentes._'
            ].join('\n');
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const existing=comments.find(c=>c.user?.type==='Bot'&&c.body?.includes('<!-- esc-issue-secretary -->'));
            if(existing){
              if(existing.body!==card)await github.rest.issues.updateComment({owner,repo,comment_id:existing.id,body:card});
            }else await github.rest.issues.createComment({owner,repo,issue_number,body:card});
