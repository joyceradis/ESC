# CI do Atlas: verifica todos os scripts (inclusive módulos novos), HTML gerado, links e dados. As skills do Claude permanecem independentes.
name: Verificar site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Economiza filas durante trabalhos simultâneos dos agentes. O último commit conserva a verificação.
concurrency:
  group: esc-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sintaxe de todos os scripts JavaScript
        run: |
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Testes dos módulos interativos (quando adicionados)
        run: |
          if [ -d tests ] && find tests -name '*.test.mjs' -type f -print -quit | grep -q .; then
            node --test tests/*.test.mjs
          else
            echo 'Sem testes de módulos .test.mjs ainda; Codex deve acrescentar testes junto com simuladores.'
          fi

      - name: Páginas geradas estão atualizadas
        run: |
          python3 build.py
          if ! git diff --exit-code -- '*.html'; then
            echo "::error::As páginas da raiz não batem com src/. Rode 'python3 build.py' e faça commit do resultado."
            exit 1
          fi

      - name: Links, âncoras e dados
        run: python3 tools/check_site.py
