name: Revisão remota do bloco AFM
on:
  pull_request:
    paths:
      - 'src/pages/laboratorio.html'
      - 'assets/css/laboratorio.css'
      - 'assets/js/laboratorio.js'
      - 'atlas/estudos-gel.json'
      - 'tools/build_atlas_data.py'
      - 'tests/**'
      - 'tools/check_afm_browser.cjs'
      - '.github/workflows/revisao-afm.yml'
permissions:
  contents: read
concurrency:
  group: afm-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  afm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build canônico e testes
        working-directory: after
        run: |
          python3 build.py
          python3 tools/check_site.py
          node --test tests/*.test.mjs
          node --check assets/js/laboratorio.js
          python3 -c 'import json,pathlib; print("GENERATED_LAB_JSON="+json.dumps(pathlib.Path("laboratorio.html").read_text())); print("GENERATED_ATLAS_JSON="+json.dumps(pathlib.Path("assets/js/atlas-dados.js").read_text()))'
      - name: Preparar navegadores somente no runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Conferir estudos e capturar antes/depois
        run: |
          python3 -m http.server 18768 --bind 127.0.0.1 > /tmp/afm-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node after/tools/check_afm_browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afm-before-after-${{ github.event.pull_request.head.sha }}
          path: |
            evidence/
            after/laboratorio.html
            after/assets/js/atlas-dados.js
          retention-days: 30
