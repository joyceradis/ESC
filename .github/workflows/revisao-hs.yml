name: Auditoria e previa HS fluxo
on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'tools/review_hs.py'
      - '.github/workflows/revisao-hs.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Conferir suplementos na nuvem
        run: |
          pip install requests pypdf
          python3 tools/review_hs.py
      - name: Gerar e verificar
        run: |
          python3 build.py
          python3 tools/check_site.py
          node --test tests/*.test.mjs
          python3 -c 'import json,pathlib; print("GENERATED_PROTOCOL="+json.dumps(pathlib.Path("protocolo.html").read_text()))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esc-hs-previa
          path: |
            *.html
            assets/
            evidence/
