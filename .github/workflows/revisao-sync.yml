name: Sincronização — fichas e conexões
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: before
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validar importador, curadoria e geração
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 build.py
          python3 tools/check_site.py
          node --check assets/js/evidence.js
          node --test tests/*.test.mjs
          python3 -c 'import json,pathlib; print("SYNC_HTML="+json.dumps(pathlib.Path("biblioteca.html").read_text())); print("SYNC_DATA="+json.dumps(pathlib.Path("assets/js/evidence-data.js").read_text()))'
      - name: Instalar navegadores
        run: |
          npm install --prefix "$RUNNER_TEMP/esc-sync" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/esc-sync/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verificar biblioteca
        env:
          NODE_PATH: ${{ runner.temp }}/esc-sync/node_modules
        run: |
          python3 -m http.server 18774 --bind 127.0.0.1 > /tmp/esc-sync-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18774/biblioteca.html; then break; fi
            sleep 1
          done
          node tools/check_evidence.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: biblioteca-fichas-conexoes
          path: evidence/sync
          if-no-files-found: warn
