name: Revisão visual — desktop e celular

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar páginas
        run: python3 build.py
      - name: Instalar navegador e Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Avaliar desktop e celular
        run: node tools/check_responsive.cjs
      - name: Salvar capturas e relatório mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisao-visual-desktop-mobile
          path: artifacts/responsive/
          if-no-files-found: warn
          retention-days: 14
